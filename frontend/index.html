    <meta name="theme-color" content="#f2f4fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161c2f" media="(prefers-color-scheme: dark)" />
    <script>
      // Set the theme before first paint to avoid a flash of the wrong
      // theme. Mirrors the logic in src/lib/themeStore.ts.
      (function () {
        try {
          var stored = localStorage.getItem("cm_theme");
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : dark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
